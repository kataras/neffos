name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go_version: [1.27.x]

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      nats:
        image: nats:2-alpine
        ports: ["4222:4222"]

    env:
      NEFFOS_REDIS_ADDR: 127.0.0.1:6379
      NEFFOS_NATS_URL: nats://127.0.0.1:4222

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go_version }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test (with race detector)
      run: go test -v -race -count=1 ./...

    - name: Vet and test examples
      working-directory: _examples
      run: go vet ./... && go test -count=1 ./...

    - name: Vet the iris integration example (its own module, pinned to the public iris release)
      working-directory: _examples/09-integrations/iris-jwt
      run: go vet ./...

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.27.x

    - name: Check out code
      uses: actions/checkout@v6

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

    - name: gofmt check
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt found unformatted files:"
          echo "$unformatted"
          exit 1
        fi
